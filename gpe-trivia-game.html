<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPE Trivia | DWA 103</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        const questions = [
            {
                question: "The Bretton Woods Conference of 1944 established two key institutions. Which of the following was NOT created at Bretton Woods?",
                options: ["International Monetary Fund (IMF)", "World Bank (IBRD)", "World Trade Organization (WTO)", "Both IMF and World Bank were created there"],
                correct: 2,
                explanation: "Both the IMF and the World Bank (IBRD) were established at Bretton Woods in 1944. The WTO wasn't created until 1995, replacing the GATT (General Agreement on Tariffs and Trade) which had been established in 1947."
            },
            {
                question: "David Ricardo's theory of comparative advantage differs from Adam Smith's concept of absolute advantage in that it suggests:",
                options: [
                    "Countries should only trade if they produce goods more efficiently than others",
                    "Countries can benefit from trade even if they are less efficient at producing all goods",
                    "Free trade is harmful to developing economies",
                    "Protectionism is necessary for industrial development"
                ],
                correct: 1,
                explanation: "Ricardo's key insight was that trade benefits all parties even when one country is more efficient at producing everything. What matters is relative (comparative) efficiency, not absolute efficiency. A country should specialize in goods where its opportunity cost is lowest."
            },
            {
                question: "What is the defining structural condition of the international system according to realist international relations theory?",
                options: [
                    "Hierarchy - with great powers at the top",
                    "Interdependence - states depend on each other",
                    "Anarchy - the absence of a central governing authority above states",
                    "Cooperation - states work together through institutions"
                ],
                correct: 2,
                explanation: "Anarchy—the absence of a world government or central authority above states—is the foundational assumption of realist IR theory. This doesn't mean chaos, but rather that states must rely on self-help since there's no higher authority to enforce rules or protect them."
            },
            {
                question: "The constructivist approach to IPE emphasizes which of the following as key drivers of economic behavior?",
                options: [
                    "Material interests and power distribution",
                    "Ideas, norms, and social identities",
                    "Class struggle and modes of production",
                    "State wealth and military power"
                ],
                correct: 1,
                explanation: "Constructivists argue that ideas, norms, and identities shape how actors understand their interests and the world economy. Unlike realists (who focus on material power) or Marxists (who focus on class), constructivists emphasize that economic behavior is socially constructed."
            },
            {
                question: "The 'Washington Consensus' of the 1990s promoted a set of policies including all of the following EXCEPT:",
                options: [
                    "Trade liberalization and deregulation",
                    "Privatization of state enterprises",
                    "Industrial policy and strategic protectionism",
                    "Fiscal discipline and market-based exchange rates"
                ],
                correct: 2,
                explanation: "The Washington Consensus advocated free-market policies: liberalization, privatization, and deregulation. Industrial policy and strategic protectionism are neomercantilist approaches—the opposite of what the Consensus promoted."
            },
            {
                question: "According to Helleiner, neomercantilists like Hamilton and List differed from earlier mercantilists primarily because they:",
                options: [
                    "Rejected all forms of international trade",
                    "Defended protectionism by engaging critically with classical liberal economic thought",
                    "Prioritized military conquest over economic development",
                    "Supported free trade for agricultural goods only"
                ],
                correct: 1,
                explanation: "Neomercantilists like Hamilton and List came after Adam Smith and had to defend protectionism against liberal free-trade arguments. Unlike earlier mercantilists, they engaged directly with liberal economic theory while arguing for strategic protection of infant industries."
            },
            {
                question: "In Lenin's theory of imperialism, what was the primary driver of European imperial expansion in the late 19th century?",
                options: [
                    "A desire to spread democratic values",
                    "The need for capitalism to export surplus capital and secure raw materials",
                    "Religious missionary goals",
                    "Population pressures in Europe"
                ],
                correct: 1,
                explanation: "Lenin argued that imperialism was the 'highest stage of capitalism'—driven by the need to export surplus capital to colonies where profits were higher, and to secure raw materials. He built on Hobson's earlier analysis but drew more radical conclusions about capitalism's fate."
            },
            {
                question: "Helleiner argues that the field of International Political Economy (IPE) has traditionally focused too narrowly on debates between which three perspectives?",
                options: [
                    "Realism, liberalism, and constructivism",
                    "Economic liberalism, neomercantilism, and Marxism",
                    "Keynesianism, monetarism, and institutionalism",
                    "Nationalism, internationalism, and cosmopolitanism"
                ],
                correct: 1,
                explanation: "Helleiner's 'Contested World Economy' argues that IPE textbooks typically focus on economic liberalism, neomercantilism, and Marxism—but this misses important perspectives like feminist IPE, environmentalism, and thinkers from the Global South."
            },
            {
                question: "According to Helleiner, classical economic liberals like Smith, Ricardo, Cobden, and Mill believed free trade would promote all of the following EXCEPT:",
                options: [
                    "Global prosperity through efficient resource allocation",
                    "International peace through economic interdependence",
                    "Equal distribution of wealth within countries",
                    "Individual liberty and freedom"
                ],
                correct: 2,
                explanation: "Classical liberals argued free trade would increase overall prosperity, promote peace (through interdependence), and expand individual freedom. However, they did not claim it would equalize wealth distribution—that concern was more central to Marxist and some feminist critiques."
            },
            {
                question: "José Carlos Mariátegui, a Peruvian Marxist discussed by Helleiner, argued that Latin American countries functioned as 'colonies' of Europe and the US because:",
                options: [
                    "They were formally governed by European powers",
                    "They exported raw materials and imported manufactured goods, creating economic dependency",
                    "They had no domestic industries whatsoever",
                    "Their populations were primarily European immigrants"
                ],
                correct: 1,
                explanation: "Mariátegui developed an early 'dependency' analysis: though Latin American countries were politically independent, their role as commodity exporters to industrialized nations created economic dependency. Foreign firms controlled key sectors and profits flowed out of the region."
            },
            {
                question: "Johann Fichte's concept of the 'closed commercial state' (1800) advocated for autarky (economic self-sufficiency) primarily to:",
                options: [
                    "Maximize exports and accumulate gold",
                    "Protect government's ability to regulate the domestic economy from foreign economic influences",
                    "Prepare for military conquest of neighboring states",
                    "Promote free market competition domestically"
                ],
                correct: 1,
                explanation: "Fichte, influenced by Rousseau, wanted a republican state that could regulate wages, prices, and employment to promote equality. He argued this was only possible in a 'closed' economy insulated from unpredictable foreign market influences—a very different rationale than mercantilism's focus on gold accumulation."
            }
        ];

        function GPETrivia() {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [selected, setSelected] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [gameOver, setGameOver] = useState(false);

            const handleAnswer = (index) => {
                if (selected !== null) return;
                setSelected(index);
                setShowResult(true);
                if (index === questions[currentQ].correct) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQ + 1 < questions.length) {
                    setCurrentQ(currentQ + 1);
                    setSelected(null);
                    setShowResult(false);
                } else {
                    setGameOver(true);
                }
            };

            const restart = () => {
                setCurrentQ(0);
                setScore(0);
                setSelected(null);
                setShowResult(false);
                setGameOver(false);
            };

            if (gameOver) {
                const percentage = Math.round((score / questions.length) * 100);
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                            <p className="text-4xl font-bold text-amber-600 mb-2">{score} / {questions.length}</p>
                            <p className="text-lg text-slate-500 mb-4">{percentage}%</p>
                            <p className="text-slate-600 mb-6">
                                {percentage >= 90 ? "Outstanding! You've mastered the material!" :
                                 percentage >= 70 ? "Great work! You have a solid understanding." :
                                 percentage >= 50 ? "Good effort! Review the readings to strengthen your knowledge." :
                                 "Keep studying! The Helleiner readings will help."}
                            </p>
                            <button
                                onClick={restart}
                                className="bg-slate-800 text-white px-6 py-3 rounded-lg font-semibold hover:bg-slate-700 transition"
                            >
                                Try Again
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-sm font-medium text-slate-500">
                                Question {currentQ + 1} of {questions.length}
                            </span>
                            <span className="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-semibold">
                                Score: {score}
                            </span>
                        </div>
                        
                        {/* Progress bar */}
                        <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
                            <div 
                                className="bg-amber-500 h-2 rounded-full transition-all duration-300"
                                style={{ width: `${((currentQ) / questions.length) * 100}%` }}
                            ></div>
                        </div>
                        
                        <h2 className="text-xl font-bold text-slate-800 mb-6 leading-relaxed">
                            {questions[currentQ].question}
                        </h2>
                        
                        <div className="space-y-3">
                            {questions[currentQ].options.map((option, index) => {
                                let btnStyle = "bg-slate-100 hover:bg-slate-200 text-slate-800 border-2 border-transparent";
                                if (showResult) {
                                    if (index === questions[currentQ].correct) {
                                        btnStyle = "bg-green-100 text-green-800 border-2 border-green-500";
                                    } else if (index === selected) {
                                        btnStyle = "bg-red-100 text-red-800 border-2 border-red-500";
                                    } else {
                                        btnStyle = "bg-slate-50 text-slate-400 border-2 border-transparent";
                                    }
                                }
                                return (
                                    <button
                                        key={index}
                                        onClick={() => handleAnswer(index)}
                                        disabled={showResult}
                                        className={`w-full p-4 rounded-lg text-left font-medium transition ${btnStyle}`}
                                    >
                                        <span className="inline-block w-6 h-6 rounded-full bg-slate-300 text-slate-600 text-center text-sm mr-3 leading-6">
                                            {String.fromCharCode(65 + index)}
                                        </span>
                                        {option}
                                    </button>
                                );
                            })}
                        </div>
                        
                        {showResult && (
                            <div className="mt-6">
                                <div className={`p-4 rounded-lg mb-3 ${selected === questions[currentQ].correct ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
                                    <p className={`font-semibold mb-2 ${selected === questions[currentQ].correct ? 'text-green-800' : 'text-red-800'}`}>
                                        {selected === questions[currentQ].correct ? "✓ Correct!" : "✗ Incorrect"}
                                    </p>
                                    {selected !== questions[currentQ].correct && (
                                        <p className="text-red-700 text-sm mb-2">
                                            The correct answer was: <strong>{questions[currentQ].options[questions[currentQ].correct]}</strong>
                                        </p>
                                    )}
                                </div>
                                <div className="p-4 rounded-lg bg-blue-50 border border-blue-200 mb-4">
                                    <p className="text-blue-800 text-sm leading-relaxed">
                                        <span className="font-semibold">💡 Explanation:</span> {questions[currentQ].explanation}
                                    </p>
                                </div>
                                <button
                                    onClick={nextQuestion}
                                    className="w-full bg-slate-800 text-white py-3 rounded-lg font-semibold hover:bg-slate-700 transition"
                                >
                                    {currentQ + 1 < questions.length ? "Next Question →" : "See Results"}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GPETrivia />);
    </script>
</body>
</html>
